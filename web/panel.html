<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenCode Zen</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 14px; --bg: #faf9f5; --surface: #fffdf9; --subtle: #f0eee8; --hover: #f6f4ee; --text: #2d2a26; --muted: #6d6760; --border: #e3e1db; --accent: #4c4842; --accent-text: #fff; --green: #158363; --green-bg: #e8f4ed; --red: #b54738; --red-bg: #fbede9; --focus: #8b8680; }
    :root[data-theme="white"] { --bg: #fff; --surface: #fff; --subtle: #f6f6f6; --hover: #fafafa; --border: #e5e5e5; }
    :root[data-theme="dark"] { color-scheme: dark; --bg: #151412; --surface: #1d1b18; --subtle: #262320; --hover: #24211e; --text: #f6f4f1; --muted: #c9c3bb; --border: #3a3530; --accent: #e9e6df; --accent-text: #262320; --green: #7ad5ae; --green-bg: #1d3329; --red: #f29c8d; --red-bg: #36231f; --focus: #b7aea3; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    button, input, select { font: inherit; -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: .5; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    [hidden] { display: none !important; }
    .icons { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .copy-input { position: fixed; left: -9999px; top: 0; }
    main { max-width: 1080px; padding: 90px 28px 28px; margin: 0 auto; }
    .page-header, .header-title, .header-actions, .toolbar, .row-actions, .dialog-header, .dialog-footer { display: flex; align-items: center; gap: 10px; }
    .page-header { justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
    .header-title { gap: 14px; }
    .brand { display: grid; place-items: center; width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 12px; background: var(--subtle); font-size: 23px; font-weight: 650; }
    h1 { margin: 0 0 5px; font-size: 22px; font-weight: 650; letter-spacing: -.5px; }
    .subtitle { margin: 0; color: var(--muted); font-size: 13px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; color: var(--text); background: var(--surface); white-space: nowrap; }
    .btn:hover:not(:disabled) { background: var(--subtle); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .btn.primary:hover:not(:disabled) { opacity: .85; }
    .btn.danger { color: var(--red); }
    .btn.danger:hover:not(:disabled) { background: var(--red-bg); border-color: var(--red); }
    .btn.compact { min-height: 30px; padding: 4px 9px; font-size: 12px; }
    .icon-btn { padding: 5px; min-height: 28px; width: 28px; background: transparent; border-color: transparent; color: var(--muted); flex: none; }
    .notice { padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; overflow-wrap: anywhere; line-height: 1.6; }
    .notice.error { background: var(--red-bg); color: var(--red); }
    .notice.success { background: var(--green-bg); color: var(--green); }
    .workspace { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); overflow: hidden; }
    .toolbar { padding: 16px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .search { display: flex; align-items: center; gap: 9px; min-width: 210px; max-width: 420px; flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 0 11px; color: var(--muted); background: var(--bg); }
    .search:focus-within { border-color: var(--focus); }
    .search input { width: 100%; border: 0; outline: 0; padding: 9px 0; color: var(--text); background: transparent; }
    select { min-height: 36px; padding: 7px 30px 7px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); }
    .summary { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .settings-scroll { overflow-x: auto; margin-bottom: 16px; }
    .plugin-settings { display: flex; align-items: center; gap: 10px; min-width: 640px; }
    .plugin-settings label { font-size: 13px; font-weight: 550; white-space: nowrap; flex: none; }
    .plugin-settings input { width: 130px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; color: var(--text); background: var(--surface); min-width: 0; text-overflow: ellipsis; }
    .plugin-settings #base-url { width: 360px; flex: none; }
    .plugin-settings .btn { flex: none; }
    .table-scroll { overflow-x: auto; }
    table { width: 1020px; border-collapse: collapse; table-layout: fixed; }
    th { text-align: left; background: var(--hover); padding: 11px 14px; font-size: 12px; font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 12px 14px; vertical-align: middle; border-bottom: 1px solid var(--border); white-space: nowrap; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: var(--hover); }
    .key-col { width: 200px; } .proxy-col { width: 210px; } .status-col { width: 112px; } .result-col { width: 254px; } .actions-col { width: 244px; }
    .value-line { display: flex; align-items: center; gap: 6px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; overflow-wrap: anywhere; line-height: 1.65; font-size: 13px; }
    .key-value { font-weight: 550; flex: 1; min-width: 0; user-select: all; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .proxy-value { flex: 1; min-width: 0; user-select: all; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .secondary { color: var(--muted); }
    .error-detail { color: var(--red); }
    .status-toggle { display: inline-flex; align-items: center; gap: 8px; border: 0; padding: 3px 0; background: transparent; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .switch-track { width: 30px; height: 18px; border-radius: 20px; background: var(--border); padding: 3px; }
    .switch-track::after { content: ""; display: block; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); }
    .status-toggle[aria-checked="true"] { color: var(--green); }
    .status-toggle[aria-checked="true"] .switch-track { background: var(--green); }
    .status-toggle[aria-checked="true"] .switch-track::after { transform: translateX(12px); background: #fff; }
    .row-actions { gap: 6px; }
    .test-result { font-size: 12px; line-height: 1.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .test-success { color: var(--green); }
    .empty { padding: 56px 20px; text-align: center; }
    .empty strong { display: block; font-size: 15px; margin-bottom: 8px; }
    .empty p { color: var(--muted); font-size: 13px; margin: 0; }
    .workspace-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
    dialog { width: min(580px, calc(100% - 32px)); max-height: calc(100% - 32px); margin: auto; padding: 0; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--text); box-shadow: 0 24px 80px #0003; }
    dialog::backdrop { background: #0005; }
    .dialog-header { justify-content: space-between; padding: 20px 24px 16px; border-bottom: 1px solid var(--border); }
    h2 { margin: 0; font-size: 18px; font-weight: 650; }
    .dialog-body { padding: 22px 24px; }
    fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
    .field { display: grid; gap: 8px; margin-bottom: 20px; }
    .field:last-child { margin-bottom: 0; }
    .field > label, .field-title { font-weight: 550; font-size: 13px; }
    .field input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; color: var(--text); background: var(--bg); min-width: 0; }
    .field input:focus { border-color: var(--focus); }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.6; }
    .proxy-options { display: flex; padding: 3px; border: 1px solid var(--border); border-radius: 9px; background: var(--subtle); gap: 3px; }
    .proxy-option { position: relative; flex: 1; text-align: center; cursor: pointer; }
    .proxy-option input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .proxy-option span { display: block; padding: 8px 5px; border-radius: 6px; font-size: 12px; color: var(--muted); }
    .proxy-option input:checked + span { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px #0001; }
    .proxy-option input:focus-visible + span { outline: 2px solid var(--focus); }
    .dialog-footer { justify-content: flex-end; padding: 16px 24px; border-top: 1px solid var(--border); background: var(--hover); }
    .dialog-body .notice { margin-top: 18px; margin-bottom: 0; }
    .delete-detail { padding: 14px; background: var(--subtle); border-radius: 8px; margin: 16px 0; }
    .delete-detail .mono { display: block; margin: 5px 0 12px; }
    .delete-detail .mono:last-child { margin-bottom: 0; }
    @media (max-width: 960px) {
      main { padding: 90px 20px 20px; }
    }
    @media (max-width: 680px) {
      main { padding: 90px 16px 16px; } .page-header { margin-bottom: 18px; } .header-actions { width: 100%; } .header-actions .btn { flex: 1; } h1 { font-size: 20px; }
      .toolbar { padding: 12px; gap: 8px; } .search { max-width: none; min-width: 0; } .summary { width: 100%; margin: 2px 0 0; }
      .dialog-body { padding: 18px; } .dialog-header, .dialog-footer { padding: 16px 18px; } .workspace-footer { padding: 12px; }
    }
  </style>
</head>
<body>
<svg class="icons" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol>
  <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6 8a7 7 0 0 1 12-2l2 3M18 16a7 7 0 0 1-12 2l-2-3"/></symbol>
  <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
  <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M15 8V4H4v11h4"/></symbol>
  <symbol id="icon-edit" viewBox="0 0 24 24"><path d="m15 4 5 5-10 10-6 1 1-6ZM12 7l5 5"/></symbol>
  <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></symbol>
  <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
</svg>
<main>
  <header class="page-header">
    <div class="header-title"><div class="brand" aria-hidden="true">Z</div><div><h1>OpenCode Zen</h1><p class="subtitle">管理 API Key 与对应代理</p></div></div>
    <div class="header-actions">
      <button id="refresh" class="btn" type="button" data-mutation><svg class="icon" aria-hidden="true"><use href="#icon-refresh"/></svg>刷新</button>
      <button id="add" class="btn primary" type="button" data-mutation><svg class="icon" aria-hidden="true"><use href="#icon-plus"/></svg>添加 Key</button>
    </div>
  </header>
  <div id="message" class="notice" role="status" aria-live="polite" hidden></div>
  <div class="settings-scroll"><form id="settings-form" class="plugin-settings">
    <label for="base-url">服务地址</label><input id="base-url" class="mono" type="url" required spellcheck="false" value="https://opencode.ai/zen/v1">
    <label for="model-prefix">模型前缀</label><input id="model-prefix" class="mono" type="text" value="opencode" spellcheck="false" placeholder="留空则不加前缀">
    <button id="save-settings" class="btn compact" type="submit" data-mutation>保存</button>
  </form></div>
  <section class="workspace" aria-label="Key 列表">
    <div class="toolbar">
      <label class="search"><svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg><input id="search" type="search" aria-label="搜索 Key 或代理" placeholder="搜索 Key 或代理" autocomplete="off"></label>
      <select id="status-filter" aria-label="筛选状态"><option value="all">全部状态</option><option value="enabled">已启用</option><option value="disabled">已停用</option></select>
      <span id="summary" class="summary">正在加载…</span>
    </div>
    <div class="table-scroll"><table id="key-table" hidden>
      <colgroup><col class="key-col"><col class="proxy-col"><col class="status-col"><col class="result-col"><col class="actions-col"></colgroup>
      <thead><tr><th scope="col">API Key</th><th scope="col">代理</th><th scope="col">状态</th><th scope="col">结果</th><th scope="col">操作</th></tr></thead>
      <tbody id="accounts"></tbody>
    </table></div>
    <div id="empty" class="empty"><strong id="empty-title">正在加载 Key</strong><p id="empty-description">读取 CPA 中的 Zen 凭据…</p></div>
    <footer class="workspace-footer"><span>每行对应一把 Key；测试使用该行代理发送简短请求，超时为 30 秒。</span><span id="result-count"></span></footer>
  </section>
</main>
<dialog id="editor" aria-labelledby="form-title">
  <form id="key-form">
    <header class="dialog-header"><h2 id="form-title">添加 Key</h2><button id="close-editor" class="btn icon-btn" type="button" aria-label="关闭编辑" data-mutation><svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg></button></header>
    <div class="dialog-body">
      <fieldset id="editor-fields">
        <div class="field"><label for="api-key">API Key</label><input id="api-key" class="mono" type="text" autocomplete="off" spellcheck="false" required placeholder="oc_sk_…" autofocus></div>
        <div class="field">
          <span class="field-title" id="proxy-label">代理方式</span>
          <div class="proxy-options" role="radiogroup" aria-labelledby="proxy-label">
            <label class="proxy-option"><input type="radio" name="proxy-mode" value="global" checked><span>全局代理</span></label>
            <label class="proxy-option"><input type="radio" name="proxy-mode" value="direct"><span>直连</span></label>
            <label class="proxy-option"><input type="radio" name="proxy-mode" value="custom"><span>独立代理</span></label>
          </div>
          <label id="proxy-input-label" for="proxy-url" hidden>代理地址</label>
          <input id="proxy-url" class="mono" type="text" autocomplete="off" spellcheck="false" placeholder="socks5h://127.0.0.1:10808" hidden>
          <span id="proxy-hint" class="hint"></span>
        </div>
      </fieldset>
      <div id="editor-message" class="notice error" role="alert" hidden></div>
    </div>
    <footer class="dialog-footer"><button id="cancel" class="btn" type="button" data-mutation>取消</button><button id="save" class="btn primary" type="submit" data-mutation>添加 Key</button></footer>
  </form>
</dialog>
<dialog id="delete-dialog" aria-labelledby="delete-title">
  <header class="dialog-header"><h2 id="delete-title">删除 Key</h2></header>
  <div class="dialog-body"><div class="hint">删除后，这把 Key 将从 CPA 中移除。</div><div class="delete-detail"><span class="hint">API Key</span><span id="delete-key" class="mono"></span><span class="hint">代理</span><span id="delete-proxy" class="mono"></span></div><div id="delete-message" class="notice error" role="alert" hidden></div></div>
  <footer class="dialog-footer"><button id="cancel-delete" class="btn" type="button" data-mutation autofocus>取消</button><button id="confirm-delete" class="btn danger" type="button" data-mutation>删除 Key</button></footer>
</dialog>
<script type="module" src="./panel.mjs"></script>
</body>
</html>
