name: Release Linux amd64

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build and release Linux amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          base_version="$(jq -r '.plugins[] | select(.id == "zen") | .version' registry.json)"
          echo "version=${base_version}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Test and build Linux amd64
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/linux_amd64
          docker run --rm \
            -e CGO_ENABLED=1 \
            -e GOOS=linux \
            -e GOARCH=amd64 \
            -e PLUGIN_VERSION \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            golang:1.26-bookworm \
            bash -c '
              set -euo pipefail
              go mod verify
              go vet ./...
              go test ./...
              go build -trimpath -buildvcs=true -buildmode=c-shared \
                -ldflags "-s -w -X main.pluginVersion=${PLUGIN_VERSION}" \
                -o dist/linux_amd64/zen.so .
            '

      - name: Package Linux amd64
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip -j "dist/zen_${PLUGIN_VERSION}_linux_amd64.zip" dist/linux_amd64/zen.so
          cd dist
          sha256sum zen_*.zip > checksums.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/zen_*.zip
            dist/checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
